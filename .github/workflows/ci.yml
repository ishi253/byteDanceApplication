name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ishi253/bytedanceapplication/deer-flow-backend

jobs:
  backend:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: deer-flow/backend
        run: uv sync --group dev

      - name: Lint backend
        working-directory: deer-flow/backend
        run: make lint

      - name: Run backend tests
        working-directory: deer-flow/backend
        run: make test

  frontend:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'deer-flow/frontend/pnpm-lock.yaml'

      - name: Install frontend dependencies
        working-directory: deer-flow/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: deer-flow/frontend
        run: pnpm lint

      - name: Typecheck frontend
        working-directory: deer-flow/frontend
        run: pnpm typecheck

      - name: Build frontend
        working-directory: deer-flow/frontend
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder
        run: pnpm build

  docker:
    if: github.event.pull_request.draft == false
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deer-flow
          file: deer-flow/docker/Dockerfile.cloudrun
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
