name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - prod
    paths:
      - 'deer-flow/backend/**'
      - 'deer-flow/docker/Dockerfile.cloudrun'
      - 'deer-flow/docker/nginx/nginx.cloudrun.conf'
      - 'deer-flow/scripts/cloudrun-start.sh'
      - 'deer-flow/cloudbuild.yaml'
      - 'deer-flow/config.example.yaml'
      - 'deer-flow/extensions_config.example.json'
      - 'deer-flow/skills/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: bytedance-490020

      - name: Build and deploy via Cloud Build
        run: |
          gcloud builds submit --config deer-flow/cloudbuild.yaml .
